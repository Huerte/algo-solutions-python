name: Celebrate Merged PR

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "solutions/**"

permissions:
  pull-requests: write

jobs:
  celebrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Post thank-you comment
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr,
              body: [
                `@${author} merged. Thanks for contributing.`,
                ``,
                `Your avatar is in (or will appear shortly in) the [contributors section](https://github.com/${owner}/${repo}#contributors) — the README updates automatically after every merge.`,
                ``,
                `You can also check the [live contributor graph](https://github.com/${owner}/${repo}/graphs/contributors).`
              ].join('\n')
            });

