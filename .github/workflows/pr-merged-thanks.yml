name: Celebrate Merged PR

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "solutions/**"

permissions:
  pull-requests: write

jobs:
  celebrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Post thank-you comment
        uses: actions/github-script@v7
        with:
          script: |
            const association = context.payload.pull_request.author_association;
            if (association !== 'FIRST_TIME_CONTRIBUTOR') return;

            const author = context.payload.pull_request.user.login;
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr,
              body: [
                `@${author} thank you for your first contribution — it means a lot.`,
                ``,
                `Your avatar is now in the [contributors section](https://github.com/${owner}/${repo}#contributors) — the README updates automatically after every merge.`
              ].join('\n')
            });

