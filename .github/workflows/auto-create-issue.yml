name: Auto-create issue for in-progress solutions

on:
  push:
    branches:
      - main
    paths:
      - "solutions/**"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    name: Open issue for flagged solution files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check for in-progress solutions and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/create_in_progress_issues.py
