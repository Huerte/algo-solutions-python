name: Auto-create issue for in-progress solutions

on:
  push:
    branches:
      - main
    paths:
      - "solutions/**"
  workflow_dispatch:

# Guard: prevent concurrent runs from creating duplicate issues
concurrency:
  group: auto-create-issue
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    name: Open issue for flagged solution files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so git diff can inspect merge commits and push ranges
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check for in-progress solutions and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/create_in_progress_issues.py
