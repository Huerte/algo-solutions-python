name: Update Topics Catalog

on:
  push:
    branches:
      - main
    paths:
      - "solutions/**"
      - "scripts/generate_topics_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-topics:
    name: Regenerate TOPICS.md
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate TOPICS.md catalog
        run: python scripts/generate_topics_index.py

      - name: Commit and push updated catalog
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add TOPICS.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: dynamically update TOPICS.md catalog and counts"
            git push
          fi

